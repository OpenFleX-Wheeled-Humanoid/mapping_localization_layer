cloud_topic: /fastlio2/body_cloud
odom_topic: /fastlio2/lio_odom
map_frame: map
local_frame: base_link

key_pose_delta_deg: 5
key_pose_delta_trans: 0.25
loop_search_radius: 1.0
loop_time_tresh: 60.0
loop_score_tresh: 0.15
loop_submap_half_range: 5
submap_resolution: 0.1
min_loop_detect_duration: 5.0

# ScanContext 参数
sc_dist_thresh: 0.2        # SC距离阈值 (0.1-0.2 严格, 0.4-0.6 宽松配合ICP验证)
sc_max_radius: 80.0        # SC最大半径 (米)
sc_num_exclude_recent: 30   # 排除最近N帧 (避免误检近邻)
sc_num_candidates: 3        # KD-tree候选数量

# NDT 粗配准参数
ndt_resolution: 1.0         # NDT网格分辨率 (米)
ndt_step_size: 0.1          # NDT步长
ndt_max_iterations: 30      # NDT最大迭代次数
ndt_epsilon: 0.01           # NDT收敛阈值
ndt_score_thresh: 1.0       # NDT配准分数阈值

# 保存地图时的 Z 轴裁剪（世界坐标系下，单位：米）
# 消除地面以下和天花板以上的噪声点
global_map_resolution: 0.05
map_z_min: 0.05
map_z_max: 3.0
