/**:
  ros__parameters:
    raw_odom_topic: raw/odom
    raw_world_cloud_topic: raw/world_cloud
    lio_odom_topic: lio_odom
    body_cloud_topic: body_cloud
    world_cloud_topic: world_cloud
    path_topic: lio_path
    wheel_odom_topic: /odom
    pgo_offset_topic: /pgo/offset
    world_frame: map
    odom_frame: odom
    body_frame: base_link
    publish_tf: false
    publish_map_odom: true
    planarize_output_pose: true
    freeze_map_odom_when_static: true
    static_linear_thresh: 0.01
    static_angular_thresh: 0.02
    static_hold_time: 0.2
    r_ib: [0.0, -1.0,  0.0,
           0.86603, 0.0, -0.5,
           0.5,  0.0,  0.86603]
    t_ib: [0.0, -0.18249, -0.24392]
    body_cloud_self_filter_enabled: true
    body_cloud_self_filter_min_x: -0.45
    body_cloud_self_filter_max_x: 0.45
    body_cloud_self_filter_min_y: -0.35
    body_cloud_self_filter_max_y: 0.35
    body_cloud_self_filter_min_z: -0.25
    body_cloud_self_filter_max_z: 0.35
    # base_link frame boxes: chassis/wheels, lift column, and lifted upper body.
    # The integrated URDF mounts lift_base_link at base_link z=0.07 and the
    # carriage/arms/head around z=1.14-1.70 m, so the old z<=0.35 box missed
    # upper-body returns that appeared as floating yellow points in RViz.
    body_cloud_self_filter_boxes: [
      -0.45, 0.45, -0.44, 0.44, -0.30, 0.45,
      -0.22, 0.22, -0.22, 0.22, 0.35, 1.20,
      -0.65, 0.65, -0.55, 0.55, 1.05, 1.85
    ]
